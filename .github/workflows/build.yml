name: Build Sankey Studio

# Déclenchement :
#  - manuel (bouton « Run workflow » dans l'onglet Actions)
#  - automatique quand on pousse un tag « v… » (ex : v0.1.0) -> crée une Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # nécessaire pour publier la Release sur un tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows-installers
            pattern: sankey-app/release/*.exe
          - os: macos-latest
            script: dist
            artifact: macos-dmg
            pattern: sankey-app/release/*.dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sankey-app
    env:
      # Build non signé : on empêche electron-builder de chercher un certificat.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier les types (TypeScript)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Construire l'application
        run: npm run ${{ matrix.script }}

      - name: Publier les fichiers en artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

      - name: Attacher à la Release (uniquement sur un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.pattern }}
